name: Build iOS IPA (AKM POS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: 🍏 Build iOS Native IPA
    runs-on: macos-14
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🛠️ Sync Capacitor & Install Pods
        run: |
          npx cap sync ios
          cd ios/App
          pod install

      - name: 🏗️ Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="${GITHUB_WORKSPACE}/build"

      - name: 📦 Package into .IPA
        run: |
          mkdir -p Payload
          cp -r "${GITHUB_WORKSPACE}/build/Release-iphoneos/App.app" Payload/
          zip -r -q AKM_POS.ipa Payload
          ls -lh AKM_POS.ipa

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKM_POS_iOS_IPA
          path: AKM_POS.ipa
          retention-days: 14

      - name: 📤 Upload .app Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AKM_POS_iOS_App_Bundle
          path: ${{ github.workspace }}/build/Release-iphoneos/App.app
          retention-days: 14

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "AKM POS iOS Native App v1.0.0"
          body: |
            ## 📱 AKM POS - iOS Native IPA Package
            - **Commit**: `${{ github.sha }}`
            - **Default Web URL**: `https://pos.anhkhamobile.com`
            
            ### 📥 Hướng dẫn cài đặt file IPA vào iPhone:
            1. Tải file **`AKM_POS.ipa`** bên dưới về máy tính.
            2. Sử dụng **Sideloadly** hoặc **3uTools** cắm cáp USB để nạp trực tiếp vào iPhone với Apple ID miễn phí.
            3. Hoặc mở file trên thiết bị đã cài **TrollStore / Scarlet / Esign / AltStore**.
          files: |
            AKM_POS.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
